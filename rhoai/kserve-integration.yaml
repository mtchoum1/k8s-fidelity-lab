# Links PR #104 ModelInferencePipeline to the KServe InferenceService managed by RHOAI.
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: rhoai-kserve-bridge
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: opendatahub
    serving.kserve.io/inferenceservice: pr104-sklearn-iris
    fidelity.ai/pr: "104"
spec:
  modelName: pr104-sklearn-iris
  replicas: 1
  image: ghcr.io/k8s-fidelity-lab/inference-server:latest
  gpuMemoryRequirement: "16Gi"
  sidecarLogging: true
  sidecarImage: ghcr.io/k8s-fidelity-lab/metrics-sidecar:latest
