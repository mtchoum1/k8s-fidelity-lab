# Links ModelInferencePipeline to KServe InferenceService expectations.
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: rhoai-kserve-bridge
  namespace: opendatahub
  labels:
    app.kubernetes.io/part-of: opendatahub
    serving.kserve.io/inferenceservice: sklearn-iris
spec:
  modelName: sklearn-iris
  replicas: 1
  image: ghcr.io/k8s-fidelity-lab/inference-server:latest
  gpuCount: "0"
  command:
    - python
    - inference_server.py
