# OperatorGroup + Subscription for OpenDataHub in kind (rhoai-in-kind).
# Requires operator-lifecycle-manager (OLM) installed in the kind cluster.
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: opendatahub
  namespace: opendatahub
spec:
  targetNamespaces:
    - opendatahub
---
apiVersion: v1
kind: Namespace
metadata:
  name: opendatahub
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: opendatahub-operator
  namespace: opendatahub
spec:
  channel: fast
  name: opendatahub-operator
  source: community-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
