# Tier 7 (OpenShift): sidecar runs as root and mounts /var/log — restricted-v2 SCC denial.
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: pr104-openshift-sidecar
  namespace: fidelity-lab-system
spec:
  modelName: sklearn-iris
  replicas: 1
  # Use Quay images built by ./scripts/run-openshift.sh (ghcr.io is 403 on CRC).
  image: quay.io/mtchoumi-aaet/lab-image:inference-server
  gpuMemoryRequirement: "16Gi"
  sidecarLogging: true
  sidecarImage: quay.io/mtchoumi-aaet/lab-image:metrics-sidecar
