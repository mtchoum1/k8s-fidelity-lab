# Tier 7 (OpenShift): sidecar runs as root and mounts /var/log — restricted-v2 SCC denial.
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: pr104-openshift-sidecar
  namespace: fidelity-lab-system
spec:
  modelName: sklearn-iris
  replicas: 1
  # Use GHCR images built by ./scripts/run-openshift.sh (auto-detects ghcr.io/OWNER/REPO from git origin).
  image: ghcr.io/<owner>/k8s-fidelity-lab:inference-server
  gpuMemoryRequirement: "16Gi"
  sidecarLogging: true
  sidecarImage: ghcr.io/<owner>/k8s-fidelity-lab:metrics-sidecar
