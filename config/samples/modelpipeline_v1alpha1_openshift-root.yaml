# Tier 7 (OpenShift): runAsRoot triggers restricted-v2 SCC denial.
# Fix: set runAsRoot: false and add non-root SecurityContext in the controller.
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: openshift-root-pipeline
  namespace: default
spec:
  modelName: sklearn-iris
  replicas: 1
  image: ghcr.io/k8s-fidelity-lab/inference-server:latest
  gpuCount: "0"
  runAsRoot: true
  command:
    - python
    - inference_server.py
