# Tier 2 (KWOK): 100 users × 5 replicas = 500 pods — triggers reconcile queue starvation.
# Usage: for i in $(seq 1 100); do sed "s/PIPELINE_NAME/scale-test-$i/" config/samples/modelpipeline_v1alpha1_scale-test.yaml | kubectl apply -f -; done
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: PIPELINE_NAME
  namespace: default
spec:
  modelName: gpu-batch-scale-test
  replicas: 5
  image: ghcr.io/k8s-fidelity-lab/inference-server:latest
  gpuMemoryRequirement: "16Gi"
  sidecarLogging: true
