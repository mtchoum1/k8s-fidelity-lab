# PR #104: high-throughput GPU batch inference & metrics sidecar
apiVersion: fidelity.ai/v1alpha1
kind: ModelInferencePipeline
metadata:
  name: pr104-gpu-batch-pipeline
  namespace: default
  labels:
    app.kubernetes.io/part-of: fidelity-lab
    fidelity.ai/pr: "104"
spec:
  modelName: sklearn-iris
  replicas: 1
  image: ghcr.io/k8s-fidelity-lab/inference-server:latest
  gpuMemoryRequirement: "16Gi"
  sidecarLogging: true
  sidecarImage: ghcr.io/k8s-fidelity-lab/metrics-sidecar:latest
